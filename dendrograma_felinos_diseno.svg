<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1000" viewBox="0 0 1480 1000" role="img" aria-labelledby="title desc">
<title id="title">La familia de los felinos: clasificación de doce especies</title>
<desc id="desc">Dendrograma lineal de la familia Felidae. Felinae incluye Felis y Lynx; Pantherinae incluye Panthera. Se muestran cuatro especies de cada género. Las ramas representan categorías taxonómicas, no distancias evolutivas.</desc>
